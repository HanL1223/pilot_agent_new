[project]
name = "agent-new"
version = "0.1.0"
description = "One Jira + BOM-weather agent on a small Waku-style harness, built with Strands."
requires-python = ">=3.13"
dependencies = [
    "strands-agents[anthropic,openai]==1.58.0",
    "mcp>=2.1,<2.2",
    "requests>=2.32",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
